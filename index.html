<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BiblioMaker — footnotes to bibliography</title>
<link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide/square-library.svg?color=%231f2937&width=64&height=64">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<!-- JSZip: only used to unzip .docx files in the browser. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:#f4f6fa;color:#222}
#menubar{flex:none;height:48px;line-height:48px;padding:0 14px;background:#1f2937;color:#fff;font-weight:800;font-size:22px;letter-spacing:.08em}
#menubar .g{color:#1f9d4c}
#menubar iconify-icon{font-size:26px;vertical-align:-5px;margin-left:6px;color:#fff}
#menubar small{margin-left:16px;font-size:14px;font-weight:400;letter-spacing:.02em;color:#aab2c0;text-transform:none}
button{font:inherit;padding:6px 14px;border:0;border-radius:6px;cursor:pointer;background:#e3e7ef;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.4;cursor:default}
#fileName{color:#1f7a3d;font-size:13px;font-weight:600}
#fileName:empty{display:none}
main{flex:1;padding:14px;min-height:0}
.tabs{display:flex;gap:4px;border-bottom:2px solid #d8dce5;margin-bottom:12px}
.tab{padding:8px 16px;border:0;border-bottom:3px solid transparent;background:none;border-radius:0;color:#667;font-weight:600}
.tab.active{color:#1f2937;border-bottom-color:#1f9d4c}
.panel{display:none}
.panel.active{display:block}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grp{display:inline-flex;border:1px solid #b9c0d0;border-radius:6px;overflow:hidden}
.grp button{border-radius:0;background:#fff;color:#334;border-right:1px solid #e3e7ef}
.grp button:last-child{border-right:0}
.grp button.on{background:#1f9d4c;color:#fff}
.stat{color:#667;font-size:13px;margin-left:auto}
.stat b{color:#1f9d4c}
#drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #bbb;border-radius:10px;padding:1rem;text-align:center;color:#667;cursor:pointer;margin-bottom:14px;transition:background .15s,border-color .15s}
#drop.hover{border-color:#1f9d4c;background:#eafaf0;color:#1f7a3d}
#drop input{display:none}
ol.fn{list-style:none;padding:0;margin:0}
ol.fn li{display:flex;gap:10px;padding:.5rem .7rem;border-bottom:1px solid #eceff4;align-items:baseline}
ol.fn li .num{min-width:2.2em;text-align:right;color:#99a;font-variant-numeric:tabular-nums}
ol.fn li.good{background:#eafaf0;border-left:3px solid #1f9d4c}
ol.fn li.bad{border-left:3px solid #e3e7ef}
ol.fn li .txt{flex:1;border-radius:4px;padding:2px 4px;outline:none;cursor:text}
ol.fn li .txt:hover{background:#fff}
ol.fn li .txt:focus{background:#fff;box-shadow:inset 0 0 0 1px #1f9d4c}
ol.fn li .kind{font-size:11px;color:#667;border:1px solid #ccd;border-radius:8px;padding:0 6px;align-self:center;white-space:nowrap}
.biblio{background:#fff;border:1px solid #d8dce5;border-radius:8px;padding:16px 20px;line-height:1.6;font:14px/1.6 system-ui,sans-serif;margin:0}
.biblio .author-block{margin-bottom:1rem}
.biblio .author-block:last-child{margin-bottom:0}
.biblio .work{display:block}
.biblio .work.sub{padding-left:2rem}
.biblio .work .title{font-style:italic}
.hint{color:#889;padding:20px;text-align:center}
.err{color:#c0392b;font-weight:600}
footer{flex:none;background:#fff;color:#667;border-top:1px solid #d8dce5;font-size:12px;padding:7px 14px;text-align:center}
footer a{color:#1f9d4c;text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="menubar"><span class="g">BIBLIO</span>MAKER <iconify-icon icon="lucide:square-library"></iconify-icon><small>Turn your footnotes into a bibliography</small></div>

<main>
  <label id="drop">
    <input type="file" accept=".docx">
    <iconify-icon icon="lucide:upload" style="font-size:28px;color:#1f9d4c"></iconify-icon>
    <div>Drag &amp; drop a <code>.docx</code> file here, or click to browse</div>
    <small>Everything runs in your browser; nothing is uploaded.</small>
    <span id="fileName"></span>
  </label>

  <div id="status"></div>

  <div class="tabs">
    <button class="tab active" data-tab="footnotes">Footnotes</button>
    <button class="tab" data-tab="bibliography">Bibliography</button>
  </div>

  <!-- FOOTNOTES -->
  <section class="panel active" id="panel-footnotes">
    <div class="toolbar">
      <div class="grp" id="filter">
        <button data-filter="all" class="on">All</button>
        <button data-filter="good">Parsed only</button>
        <button data-filter="bad">Unparsed only</button>
      </div>
      <button id="exportFn"><iconify-icon icon="lucide:download"></iconify-icon> Export footnotes</button>
      <span class="stat" id="fnStat"></span>
    </div>
    <ol class="fn" id="fnList"></ol>
    <div class="hint" id="fnHint">Load a document to see its footnotes.</div>
  </section>

  <!-- BIBLIOGRAPHY -->
  <section class="panel" id="panel-bibliography">
    <div class="toolbar">
      <button id="exportBib"><iconify-icon icon="lucide:download"></iconify-icon> Export bibliography</button>
      <span class="stat" id="bibStat"></span>
    </div>
    <div class="biblio" id="bibOut"></div>
    <div class="hint" id="bibHint">Load a document to generate its bibliography.</div>
  </section>
</main>

<footer>© Nicolas Beney. Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0 ↗</a></footer>

<script src="parser.js"></script>
<script>
const { parseFootnote, generateBibliography } = window.BiblioMaker;
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const SKIP_TYPES = new Set(['separator', 'continuationSeparator', 'continuationNotice']);

const $ = (s) => document.querySelector(s);
let state = { footnotes: [], parsed: [], biblioEntries: [], biblioText: '', filter: 'all' };

/* ---------- file loading ---------- */
const drop = $('#drop');
['dragenter', 'dragover'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

drop.querySelector('input').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) handleFile(f); });

function setStatus(msg, isError) {
  $('#status').innerHTML = msg ? `<p class="${isError ? 'err' : ''}">${msg}</p>` : '';
}

async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.docx')) {
    setStatus('That does not look like a .docx file.', true);
    return;
  }
  $('#fileName').textContent = file.name;
  setStatus('Reading ' + file.name + '…');
  try {
    const zip = await JSZip.loadAsync(file);
    const entry = zip.file('word/footnotes.xml');
    if (!entry) { setStatus('No footnotes found in this document.', false); loadFootnotes([]); return; }
    const xml = await entry.async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) { setStatus('Could not parse footnotes.xml.', true); return; }

    const notes = Array.from(doc.getElementsByTagNameNS(W_NS, 'footnote'));
    const footnotes = [];
    for (const note of notes) {
      const type = note.getAttributeNS(W_NS, 'type');
      if (type && SKIP_TYPES.has(type)) continue;
      const txt = Array.from(note.getElementsByTagNameNS(W_NS, 't')).map((t) => t.textContent).join('');
      const trimmed = txt.trim();
      if (trimmed) footnotes.push(trimmed);
    }
    setStatus('');
    loadFootnotes(footnotes);
  } catch (err) {
    console.error(err);
    setStatus('Failed to read the file: ' + err.message, true);
  }
}

function loadFootnotes(footnotes) {
  state.footnotes = footnotes;
  state.parsed = footnotes.map(parseFootnote);
  const bib = generateBibliography(footnotes);
  state.biblioEntries = bib.entries;
  state.biblioText = bib.text;
  renderFootnotes();
  renderBibliography();
}

/* ---------- footnotes rendering ---------- */
$('#filter').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.filter = b.dataset.filter;
  $('#filter').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  renderFootnotes();
});

function renderFootnotes() {
  const list = $('#fnList');
  list.innerHTML = '';
  const total = state.parsed.length;
  const good = state.parsed.filter((r) => r.parsed).length;
  $('#fnHint').style.display = total ? 'none' : 'block';
  $('#fnStat').innerHTML = total
    ? `<b>${good}</b> parsed / ${total} total`
    : '';

  state.parsed.forEach((r, i) => {
    if (state.filter === 'good' && !r.parsed) return;
    if (state.filter === 'bad' && r.parsed) return;
    const li = document.createElement('li');
    li.className = r.parsed ? 'good' : 'bad';
    li.dataset.index = i;
    li.innerHTML =
      `<span class="num">${i + 1}.</span>` +
      `<span class="txt" contenteditable="true" spellcheck="false"></span>` +
      `<span class="kind">${r.kind}</span>`;
    li.querySelector('.txt').textContent = r.raw;
    list.appendChild(li);
  });
}

// Live editing: re-parse the edited footnote, update its row in place (without
// a full re-render, to preserve the caret), refresh counts, and regenerate the
// bibliography.
$('#fnList').addEventListener('input', (e) => {
  const txt = e.target.closest('.txt');
  if (!txt) return;
  const li = txt.closest('li');
  const i = Number(li.dataset.index);

  const value = txt.textContent;
  state.footnotes[i] = value;
  const r = parseFootnote(value);
  state.parsed[i] = r;

  // Update this row's highlight + kind badge in place.
  li.className = r.parsed ? 'good' : 'bad';
  li.querySelector('.kind').textContent = r.kind;

  // Update the parsed/total counter.
  const total = state.parsed.length;
  const good = state.parsed.filter((x) => x.parsed).length;
  $('#fnStat').innerHTML = `<b>${good}</b> parsed / ${total} total`;

  // Regenerate the bibliography from the current footnote set.
  const bib = generateBibliography(state.footnotes);
  state.biblioEntries = bib.entries;
  state.biblioText = bib.text;
  renderBibliography();
});

// Keyboard navigation while editing a footnote.
$('#fnList').addEventListener('keydown', (e) => {
  const txt = e.target.closest('.txt');
  if (!txt) return;
  const li = txt.closest('li');

  // Only the currently rendered (filter-respecting) rows are navigable.
  const rows = [...$('#fnList').querySelectorAll('li')];
  const idx = rows.indexOf(li);

  const focusRow = (target) => {
    if (!target) return;
    const t = target.querySelector('.txt');
    t.focus();
    // Place the caret at the end of the target footnote.
    const range = document.createRange();
    range.selectNodeContents(t);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    t.scrollIntoView({ block: 'nearest' });
  };

  switch (e.key) {
    case 'ArrowUp':
      e.preventDefault();
      focusRow(rows[idx - 1]);
      break;
    case 'ArrowDown':
    case 'Enter':
      e.preventDefault();
      focusRow(rows[idx + 1]);
      break;
    case 'Escape':
      e.preventDefault();
      txt.blur();
      break;
  }
});

/* ---------- bibliography rendering ---------- */
function renderBibliography() {
  const out = $('#bibOut');
  out.innerHTML = '';
  const entries = state.biblioEntries;
  $('#bibHint').style.display = entries.length ? 'none' : 'block';

  let workCount = 0;
  for (const entry of entries) {
    const block = document.createElement('div');
    block.className = 'author-block';
    entry.works.forEach((w, i) => {
      workCount++;
      const line = document.createElement('span');
      line.className = i === 0 ? 'work' : 'work sub';
      // Lead: author name on the first work, em-dash on subsequent ones.
      const lead = document.createElement('span');
      lead.textContent = (i === 0 ? entry.author : '—') + '. ';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = w.title;
      const tail = document.createElement('span');
      tail.textContent = [w.publisher, w.year].filter(Boolean).map((x) => ', ' + x).join('');
      line.append(lead, title, tail);
      block.appendChild(line);
    });
    out.appendChild(block);
  }
  $('#bibStat').innerHTML = workCount ? `<b>${workCount}</b> works` : '';
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach((t) =>
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach((p) =>
      p.classList.toggle('active', p.id === 'panel-' + t.dataset.tab));
  }));

/* ---------- export ---------- */
function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

$('#exportFn').addEventListener('click', () => {
  if (!state.footnotes.length) return;
  const lines = state.parsed.map((r, i) =>
    `${i + 1}. [${r.parsed ? 'parsed:' + r.kind : 'unparsed:' + r.kind}] ${r.raw}`);
  download('footnotes.txt', lines.join('\n') + '\n');
});

$('#exportBib').addEventListener('click', () => {
  if (!state.biblioText) return;
  download('bibliography.txt', 'BIBLIOGRAPHY:\n\n' + state.biblioText + '\n');
});
</script>
</body>
</html>
