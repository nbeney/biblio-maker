<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BiblioMaker — footnotes to bibliography</title>
<link rel="icon" type="image/svg+xml" href="https://api.iconify.design/lucide/square-library.svg?color=%231f2937&width=64&height=64">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
<!-- JSZip: only used to unzip .docx files in the browser. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:#f4f6fa;color:#222}
#menubar{flex:none;height:48px;line-height:48px;padding:0 14px;background:#1f2937;color:#fff;font-weight:800;font-size:22px;letter-spacing:.08em}
#menubar .g{color:#1f9d4c}
#menubar iconify-icon{font-size:26px;vertical-align:-5px;margin-left:6px;color:#fff}
#menubar small{margin-left:16px;font-size:14px;font-weight:400;letter-spacing:.02em;color:#aab2c0;text-transform:none}
button{font:inherit;padding:6px 14px;border:0;border-radius:6px;cursor:pointer;background:#e3e7ef;display:inline-flex;align-items:center;gap:6px}
button:disabled{opacity:.4;cursor:default}
#fileName{color:#1f7a3d;font-size:13px;font-weight:600}
#fileName:empty{display:none}
#top{flex:none;padding:14px 14px 0;background:#f4f6fa}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 14px}
.tabs{display:flex;gap:4px;border-bottom:2px solid #d8dce5;margin-bottom:12px}
.tab{padding:8px 16px;border:0;border-bottom:3px solid transparent;background:none;border-radius:0;color:#667;font-weight:600}
.tab.active{color:#1f2937;border-bottom-color:#1f9d4c}
.panel{display:none}
.panel.active{display:flex;flex-direction:column;flex:1;min-height:0}
.scroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:14px}
.toolbar{flex:none}
.search{position:relative;display:inline-flex;align-items:center;flex:1;min-width:14em;max-width:24em}
.search iconify-icon{position:absolute;left:10px;font-size:16px;color:#889;pointer-events:none}
#filterText{font:inherit;padding:6px 10px 6px 32px;border:1px solid #b9c0d0;border-radius:6px;width:100%}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grp{display:inline-flex;border:1px solid #b9c0d0;border-radius:6px;overflow:hidden}
.grp button{border-radius:0;background:#fff;color:#334;border-right:1px solid #e3e7ef}
.grp button:last-child{border-right:0}
.grp button.on{background:#1f9d4c;color:#fff}
.stat{color:#667;font-size:13px;margin-left:auto}
.stat b{color:#1f9d4c}
#drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed #bbb;border-radius:10px;padding:.6rem;text-align:center;color:#667;cursor:pointer;margin-bottom:14px;transition:background .15s,border-color .15s}
#drop.hover{border-color:#1f9d4c;background:#eafaf0;color:#1f7a3d}
#drop input{display:none}
ol.fn{list-style:none;padding:0;margin:0}
ol.fn li{display:flex;gap:10px;padding:.5rem .7rem;border-bottom:1px solid #eceff4;align-items:baseline}
ol.fn li .num{min-width:2.2em;text-align:right;color:#99a;font-variant-numeric:tabular-nums}
ol.fn li.good{background:#eafaf0;border-left:3px solid #1f9d4c}
ol.fn li.bad{border-left:3px solid #e3e7ef}
ol.fn li .txt{flex:1;border-radius:4px;padding:2px 4px;outline:none;cursor:text}
ol.fn li .txt:hover{background:#fff}
ol.fn li .txt:focus{background:#fff;box-shadow:inset 0 0 0 1px #1f9d4c}
ol.fn li .kind{font-size:11px;color:#667;border:1px solid #ccd;border-radius:8px;padding:0 6px;align-self:center;white-space:nowrap}
.biblio{background:#fff;border:1px solid #d8dce5;border-radius:8px;padding:16px 20px;line-height:1.6;font:14px/1.6 system-ui,sans-serif;margin:0}
.biblio .author-block{margin-bottom:1rem}
.biblio .author-block:last-child{margin-bottom:0}
.biblio .work{display:block}
.biblio .work.sub{padding-left:2rem}
.biblio .work .title{font-style:italic}
.hint{color:#889;padding:20px;text-align:center}
.err{color:#c0392b;font-weight:600}
@media(max-width:600px){#menubar small{display:none}#drop small{display:none}}
footer{flex:none;background:#fff;color:#667;border-top:1px solid #d8dce5;font-size:12px;padding:7px 14px;text-align:center}
footer a{color:#1f9d4c;text-decoration:none}footer a:hover{text-decoration:underline}
</style>
</head>
<body>
<div id="menubar"><span class="g">BIBLIO</span>MAKER <iconify-icon icon="lucide:square-library"></iconify-icon><small>Turn your footnotes into a bibliography</small></div>

<div id="top">
  <label id="drop">
    <input type="file" accept=".docx">
    <iconify-icon icon="lucide:upload" style="font-size:28px;color:#1f9d4c"></iconify-icon>
    <div>Drag &amp; drop a <code>.docx</code> file here, or click to browse</div>
    <small>Everything runs in your browser; nothing is uploaded.</small>
    <span id="fileName"></span>
  </label>

  <div id="status"></div>

  <div class="tabs">
    <button class="tab active" data-tab="footnotes" title="Review and edit the footnotes">Footnotes</button>
    <button class="tab" data-tab="bibliography" title="View the generated bibliography">Bibliography</button>
  </div>
</div>

<main>
  <!-- FOOTNOTES -->
  <section class="panel active" id="panel-footnotes">
    <div class="toolbar">
      <div class="grp" id="filter" role="group" aria-label="Filter by parse status">
        <button data-filter="all" class="on" title="Show all footnotes">All <span class="cnt"></span></button>
        <button data-filter="good" title="Show only footnotes recognised as references">Parsed <span class="cnt"></span></button>
        <button data-filter="bad" title="Show only footnotes that were not recognised as references">Unparsed <span class="cnt"></span></button>
      </div>
      <span class="search"><iconify-icon icon="lucide:search"></iconify-icon><input type="search" id="filterText" placeholder="Filter, e.g. milton -ibid" title="Space-separated terms. Prefix a term with - to exclude it." spellcheck="false"></span>
      <button id="copyFn" title="Copy the visible footnotes to the clipboard as plain text"><iconify-icon icon="lucide:copy"></iconify-icon> Copy</button>
      <button id="exportFn" title="Download the visible footnotes as footnotes.txt"><iconify-icon icon="lucide:download"></iconify-icon> Export</button>
      <button id="clearFn" title="Delete all footnotes, including the auto-saved copy"><iconify-icon icon="lucide:trash-2"></iconify-icon> Clear</button>
      <span class="stat" id="fnStat" title="Footnotes shown / hidden by the current filters"></span>
    </div>
    <div class="scroll">
      <ol class="fn" id="fnList"></ol>
      <div class="hint" id="fnHint">Load a document to see its footnotes.</div>
    </div>
  </section>

  <!-- BIBLIOGRAPHY -->
  <section class="panel" id="panel-bibliography">
    <div class="toolbar">
      <button id="copyBib" title="Copy the bibliography to the clipboard (rich text with italics, plus plain text)"><iconify-icon icon="lucide:copy"></iconify-icon> Copy</button>
      <button id="exportBib" title="Download the bibliography as bibliography.txt"><iconify-icon icon="lucide:download"></iconify-icon> Export</button>
      <button id="clearBib" title="Delete all footnotes and the generated bibliography, including the auto-saved copy"><iconify-icon icon="lucide:trash-2"></iconify-icon> Clear</button>
      <span class="stat" id="bibStat" title="Number of distinct works in the bibliography"></span>
    </div>
    <div class="scroll">
      <div class="biblio" id="bibOut"></div>
      <div class="hint" id="bibHint">Load a document to generate its bibliography.</div>
    </div>
  </section>
</main>

<footer>© Nicolas Beney. Licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0 ↗</a></footer>

<script src="parser.js"></script>
<script>
const { parseFootnote, generateBibliography } = window.BiblioMaker;
const W_NS = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
const SKIP_TYPES = new Set(['separator', 'continuationSeparator', 'continuationNotice']);

const $ = (s) => document.querySelector(s);
let state = { footnotes: [], parsed: [], biblioEntries: [], biblioText: '', filter: 'all', text: '', fileName: '' };

/* ---------- file loading ---------- */
const drop = $('#drop');
['dragenter', 'dragover'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hover'); }));
['dragleave', 'drop'].forEach((ev) =>
  drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hover'); }));
drop.addEventListener('drop', (e) => { const f = e.dataTransfer.files[0]; if (f) handleFile(f); });

drop.querySelector('input').addEventListener('change', (e) => { const f = e.target.files[0]; if (f) handleFile(f); });

function setStatus(msg, isError) {
  $('#status').innerHTML = msg ? `<p class="${isError ? 'err' : ''}">${msg}</p>` : '';
}

async function handleFile(file) {
  if (!file.name.toLowerCase().endsWith('.docx')) {
    setStatus('That does not look like a .docx file.', true);
    return;
  }
  $('#fileName').textContent = file.name;
  state.fileName = file.name;
  setStatus('Reading ' + file.name + '…');
  try {
    const zip = await JSZip.loadAsync(file);
    const entry = zip.file('word/footnotes.xml');
    if (!entry) { setStatus('No footnotes found in this document.', false); loadFootnotes([]); return; }
    const xml = await entry.async('string');
    const doc = new DOMParser().parseFromString(xml, 'application/xml');
    if (doc.querySelector('parsererror')) { setStatus('Could not parse footnotes.xml.', true); return; }

    const notes = Array.from(doc.getElementsByTagNameNS(W_NS, 'footnote'));
    const footnotes = [];
    for (const note of notes) {
      const type = note.getAttributeNS(W_NS, 'type');
      if (type && SKIP_TYPES.has(type)) continue;
      const txt = Array.from(note.getElementsByTagNameNS(W_NS, 't')).map((t) => t.textContent).join('');
      const trimmed = txt.trim();
      if (trimmed) footnotes.push(trimmed);
    }
    setStatus('');
    loadFootnotes(footnotes);
  } catch (err) {
    console.error(err);
    setStatus('Failed to read the file: ' + err.message, true);
  }
}

function loadFootnotes(footnotes) {
  state.footnotes = footnotes;
  state.parsed = footnotes.map(parseFootnote);
  const bib = generateBibliography(footnotes);
  state.biblioEntries = bib.entries;
  state.biblioText = bib.text;
  renderFootnotes();
  renderBibliography();
  scheduleSave();
}

/* ---------- footnotes rendering ---------- */
$('#filter').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.filter = b.dataset.filter;
  $('#filter').querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
  renderFootnotes();
});

// Text filter: space-separated terms, case-insensitive substring match.
// "-term" excludes footnotes containing term; all other terms must be present.
function matchesText(raw) {
  const hay = raw.toLowerCase();
  for (const t of state.text.toLowerCase().split(/\s+/).filter(Boolean)) {
    if (t.startsWith('-')) {
      if (t.length > 1 && hay.includes(t.slice(1))) return false;
    } else if (!hay.includes(t)) return false;
  }
  return true;
}

function isVisible(r) {
  if (state.filter === 'good' && !r.parsed) return false;
  if (state.filter === 'bad' && r.parsed) return false;
  return matchesText(r.raw);
}

function updateFnStat() {
  const total = state.parsed.length;
  const good = state.parsed.filter((x) => x.parsed).length;
  const visible = state.parsed.filter(isVisible).length;
  const counts = { all: total, good, bad: total - good };
  document.querySelectorAll('#filter button').forEach((b) => {
    b.querySelector('.cnt').textContent = total ? `(${counts[b.dataset.filter]})` : '';
  });
  $('#fnStat').innerHTML = total ? `<b>${visible}</b> visible / ${total - visible} hidden` : '';
}

$('#filterText').addEventListener('input', (e) => { state.text = e.target.value; renderFootnotes(); });

function renderFootnotes() {
  const list = $('#fnList');
  list.innerHTML = '';
  $('#fnHint').style.display = state.parsed.length ? 'none' : 'block';
  updateFnStat();

  state.parsed.forEach((r, i) => {
    if (!isVisible(r)) return;
    const li = document.createElement('li');
    li.className = r.parsed ? 'good' : 'bad';
    li.dataset.index = i;
    li.innerHTML =
      `<span class="num">${i + 1}.</span>` +
      `<span class="txt" contenteditable="true" spellcheck="false" title="Click to edit. Up/Down/Enter move between footnotes, Esc leaves the field"></span>` +
      `<span class="kind" title="Detected footnote type">${r.kind}</span>`;
    li.querySelector('.txt').textContent = r.raw;
    list.appendChild(li);
  });
}

// Live editing: re-parse the edited footnote, update its row in place (without
// a full re-render, to preserve the caret), refresh counts, and regenerate the
// bibliography.
$('#fnList').addEventListener('input', (e) => {
  const txt = e.target.closest('.txt');
  if (!txt) return;
  const li = txt.closest('li');
  const i = Number(li.dataset.index);

  const value = txt.textContent;
  state.footnotes[i] = value;
  const r = parseFootnote(value);
  state.parsed[i] = r;

  // Update this row's highlight + kind badge in place.
  li.className = r.parsed ? 'good' : 'bad';
  li.querySelector('.kind').textContent = r.kind;

  // Update the parsed/total counter.
  updateFnStat();

  // Regenerate the bibliography from the current footnote set.
  const bib = generateBibliography(state.footnotes);
  state.biblioEntries = bib.entries;
  state.biblioText = bib.text;
  renderBibliography();
  scheduleSave();
});

// Keyboard navigation while editing a footnote.
$('#fnList').addEventListener('keydown', (e) => {
  const txt = e.target.closest('.txt');
  if (!txt) return;
  const li = txt.closest('li');

  // Only the currently rendered (filter-respecting) rows are navigable.
  const rows = [...$('#fnList').querySelectorAll('li')];
  const idx = rows.indexOf(li);

  const focusRow = (target) => {
    if (!target) return;
    const t = target.querySelector('.txt');
    t.focus();
    // Place the caret at the end of the target footnote.
    const range = document.createRange();
    range.selectNodeContents(t);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
    t.scrollIntoView({ block: 'nearest' });
  };

  switch (e.key) {
    case 'ArrowUp':
      e.preventDefault();
      focusRow(rows[idx - 1]);
      break;
    case 'ArrowDown':
    case 'Enter':
      e.preventDefault();
      focusRow(rows[idx + 1]);
      break;
    case 'Escape':
      e.preventDefault();
      txt.blur();
      break;
  }
});

/* ---------- bibliography rendering ---------- */
function renderBibliography() {
  const out = $('#bibOut');
  out.innerHTML = '';
  const entries = state.biblioEntries;
  $('#bibHint').style.display = entries.length ? 'none' : 'block';

  let workCount = 0;
  for (const entry of entries) {
    const block = document.createElement('div');
    block.className = 'author-block';
    entry.works.forEach((w, i) => {
      workCount++;
      const line = document.createElement('span');
      line.className = i === 0 ? 'work' : 'work sub';
      // Lead: author name on the first work, em-dash on subsequent ones.
      const lead = document.createElement('span');
      lead.textContent = (i === 0 ? entry.author : '—') + '. ';
      const title = document.createElement('span');
      title.className = 'title';
      title.textContent = w.title;
      const tail = document.createElement('span');
      tail.textContent = [w.publisher, w.year].filter(Boolean).map((x) => ', ' + x).join('');
      line.append(lead, title, tail);
      block.appendChild(line);
    });
    out.appendChild(block);
  }
  $('#bibStat').innerHTML = workCount ? `<b>${workCount}</b> works` : '';
}

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach((t) =>
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
    document.querySelectorAll('.panel').forEach((p) =>
      p.classList.toggle('active', p.id === 'panel-' + t.dataset.tab));
  }));

/* ---------- export ---------- */
function download(name, text) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

function visibleFootnoteLines() {
  return state.parsed
    .map((r, i) => (isVisible(r) ? `${i + 1}. [${r.parsed ? 'parsed:' : 'unparsed:'}${r.kind}] ${r.raw}` : null))
    .filter(Boolean);
}

// Legacy clipboard copy for insecure contexts (plain http:// on a real domain),
// where navigator.clipboard is undefined. Copies plain text only.
function legacyCopyText(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function copyTo(btn, items) {
  const label = btn.innerHTML;
  const plain = items['text/plain'];
  let ok = false;
  try {
    // The async Clipboard API is only available in a secure context
    // (https:// or localhost). Fall back to execCommand otherwise.
    if (navigator.clipboard && window.isSecureContext) {
      if (window.ClipboardItem && Object.keys(items).length > 1) {
        const data = {};
        for (const [type, text] of Object.entries(items)) data[type] = new Blob([text], { type });
        await navigator.clipboard.write([new ClipboardItem(data)]);
      } else {
        await navigator.clipboard.writeText(plain);
      }
      ok = true;
    } else {
      ok = legacyCopyText(plain);
    }
  } catch (err) {
    console.error(err);
    ok = legacyCopyText(plain); // last-ditch fallback
  }
  btn.textContent = ok ? 'Copied!' : 'Copy failed';
  setTimeout(() => { btn.innerHTML = label; }, 1500);
}

// Exports and copies cover the footnotes currently shown (filters applied).
$('#exportFn').addEventListener('click', () => {
  const lines = visibleFootnoteLines();
  if (lines.length) download('footnotes.txt', lines.join('\n') + '\n');
});

$('#copyFn').addEventListener('click', (e) => {
  const lines = visibleFootnoteLines();
  if (lines.length) copyTo(e.currentTarget, { 'text/plain': lines.join('\n') });
});

$('#exportBib').addEventListener('click', () => {
  if (!state.biblioText) return;
  download('bibliography.txt', 'BIBLIOGRAPHY:\n\n' + state.biblioText + '\n');
});

const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// HTML version: italic titles, one <p> per author with space after it.
function biblioHtml() {
  return state.biblioEntries.map((entry) =>
    '<p style="margin:0 0 1em 0">' +
    entry.works.map((w, i) =>
      (i === 0 ? esc(entry.author) : '—') + '. <i>' + esc(w.title) + '</i>' +
      esc([w.publisher, w.year].filter(Boolean).map((x) => ', ' + x).join(''))
    ).join('<br>') + '</p>'
  ).join('');
}

$('#copyBib').addEventListener('click', (e) => {
  if (!state.biblioText) return;
  copyTo(e.currentTarget, { 'text/html': biblioHtml(), 'text/plain': state.biblioText });
});

/* ---------- auto-save (IndexedDB) ---------- */
// Persists the (possibly hand-edited) footnotes so a reload doesn't lose work.
const DB_NAME = 'biblio-maker', STORE = 'session', KEY = 'current';
function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbOp(mode, fn) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const req = fn(db.transaction(STORE, mode).objectStore(STORE));
    req.onsuccess = () => { db.close(); resolve(req.result); };
    req.onerror = () => { db.close(); reject(req.error); };
  });
}

let saveTimer;
function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    try {
      await dbOp('readwrite', (st) => st.put(
        { fileName: state.fileName, footnotes: state.footnotes, savedAt: Date.now() }, KEY));
    } catch (err) { console.warn('Auto-save failed', err); }
  }, 500);
}

// Clearing wipes the footnotes (the single source of truth) and the derived
// bibliography, plus the auto-saved copy. Both the Footnotes and Bibliography
// Clear buttons share this.
async function clearAll() {
  if (!state.footnotes.length) return;
  if (!confirm('Delete all footnotes and the generated bibliography? This also removes the auto-saved copy and cannot be undone.')) return;
  clearTimeout(saveTimer);
  state.fileName = '';
  $('#fileName').textContent = '';
  drop.querySelector('input').value = '';
  state.footnotes = [];
  state.parsed = [];
  state.biblioEntries = [];
  state.biblioText = '';
  renderFootnotes();
  renderBibliography();
  setStatus('');
  try { await dbOp('readwrite', (st) => st.delete(KEY)); }
  catch (err) { console.warn('Could not clear saved session', err); }
}

$('#clearFn').addEventListener('click', clearAll);
$('#clearBib').addEventListener('click', clearAll);

(async function restore() {
  try {
    const saved = await dbOp('readonly', (st) => st.get(KEY));
    if (!saved || !saved.footnotes || !saved.footnotes.length) return;
    state.fileName = saved.fileName || '';
    $('#fileName').textContent = state.fileName;
    loadFootnotes(saved.footnotes);
    setStatus('Restored your last session (' + new Date(saved.savedAt).toLocaleString() + ').');
  } catch (err) { console.warn('Restore failed', err); }
})();
</script>
</body>
</html>
